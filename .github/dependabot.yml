# 依存パッケージの更新（脆弱性の修正を含む）を、月に一度まとめて PR にする
version: 2
updates:
  # 画面と Worker（npm workspaces なので、直下の package-lock.json だけで両方を見る）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
